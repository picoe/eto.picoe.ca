<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 320 240">
  <defs>
    <filter id="softShadow3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feOffset dy="4" result="offset"/>
      <feMerge>
        <feMergeNode in="offset"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="pad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e3440"/>
      <stop offset="1" stop-color="#232831"/>
    </linearGradient>
  </defs>

  <!-- workpad -->
  <rect x="40" y="48" width="240" height="144" rx="18" fill="url(#pad)" filter="url(#softShadow3)"
        stroke="#3b404a" stroke-dasharray="6 6"/>
