<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 320 240">
  <defs>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feOffset dy="4" result="offset"/>
      <feMerge>
        <feMergeNode in="offset"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f36"/>
      <stop offset="1" stop-color="#1f2329"/>
    </linearGradient>
    <linearGradient id="dialog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe8ff"/>
      <stop offset="1" stop-color="#e9f3ff"/>
    </linearGradient>
  </defs>

  <!-- code panel -->
  <rect x="20" y="40" rx="12" ry="12" width="190" height="140" fill="url(#panel)" filter="url(#softShadow)" />
  <!-- traffic lights -->
  <circle cx="42" cy="62" r="5" fill="#ff6b6b"/>
  <circle cx="58" cy="62" r="5" fill="#ffd166"/>
  <circle cx="74" cy="62" r="5" fill="#4cd964"/>
  <!-- code lines -->
  <g opacity="0.6" stroke="#aab2bf" stroke-linecap="round">
    <line x1="36" y1="84" x2="190" y2="84" stroke-width="4"/>
    <line x1="36" y1="98" x2="168" y2="98" stroke-width="4"/>
    <line x1="36" y1="112" x2="120" y2="112" stroke-width="4"/>
    <line x1="36" y1="126" x2="172" y2="126" stroke-width="4"/>
    <line x1="36" y1="140" x2="110" y2="140" stroke-width="4"/>
  </g>

  <!-- dialog preview -->
  <rect x="140" y="94" rx="10" ry="10" width="160" height="96" fill="url(#dialog)" stroke="#a8c7ff" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="156" y="112" rx="6" ry="6" width="128" height="20" fill="#ffffff" stroke="#ccd9ff"/>
  <rect x="156" y="140" rx="6" ry="6" width="84" height="14" fill="#ffffff" stroke="#d5e1ff"/>
  <rect x="156" y="160" rx="6" ry="6" width="64" height="14" fill="#ffffff" stroke="#d5e1ff"/>
</svg>