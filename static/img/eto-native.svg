<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 320 240">
  <defs>
    <filter id="softShadow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feOffset dy="4" result="offset"/>
      <feMerge>
        <feMergeNode in="offset"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e3440"/>
      <stop offset="1" stop-color="#232831"/>
    </linearGradient>
    <linearGradient id="laptop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#404654"/>
      <stop offset="1" stop-color="#2b2f3a"/>
    </linearGradient>
  </defs>

  <!-- Windows tile icon -->
  <rect x="28" y="56" width="120" height="120" rx="16" ry="16" fill="url(#tile)" filter="url(#softShadow2)"/>
  <g transform="translate(54,82)" fill="#4aa3ff">
    <rect x="0" y="0" width="30" height="30" rx="3"/>
    <rect x="38" y="0" width="30" height="30" rx="3"/>
    <rect x="0" y="38" width="30" height="30" rx="3"/>
    <rect x="38" y="38" width="30" height="30" rx="3"/>
  </g>

  <!-- Mac laptop with window -->
  <g transform="translate(160,72)">
    <rect x="0" y="0" width="140" height="90" rx="10" fill="url(#laptop)" filter="url(#softShadow2)"/>
    <rect x="10" y="12" width="120" height="60" rx="6" fill="#f6f7fb"/>
    <circle cx="20" cy="22" r="4" fill="#ff6b6b"/>
    <circle cx="32" cy="22" r="4" fill="#ffd166"/>
    <circle cx="44" cy="22" r="4" fill="#4cd964"/>
    <rect x="0" y="90" width="140" height="10" rx="5" fill="#1d2028"/>
  </g>
</svg>