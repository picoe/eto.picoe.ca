<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 320 240">
  <defs>
    <filter id="s3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="b"/>
      <feOffset dy="3" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="under" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e3440"/><stop offset="1" stop-color="#232831"/>
    </linearGradient>
  </defs>
  <g font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="700" font-size="11">
    <!-- The Eto control -->
    <g transform="translate(14,72)">
      <rect width="120" height="96" rx="10" fill="#f6f7fb" filter="url(#s3)"/>
      <text x="14" y="26" fill="#5f6c80">Eto Button</text>
      <rect x="14" y="48" width="92" height="28" rx="7" fill="#1f9bbd"/>
      <text x="60" y="66" fill="#fff" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="600" font-size="12">Click Me</text>
    </g>
    <!-- Reaches the native control on each platform -->
    <path d="M142 120 H172 M164 112 L172 120 L164 128" fill="none" stroke="#77cfe6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g filter="url(#s3)">
      <rect x="182" y="72" width="124" height="26" rx="7" fill="url(#under)"/>
      <rect x="182" y="107" width="124" height="26" rx="7" fill="url(#under)"/>
      <rect x="182" y="142" width="124" height="26" rx="7" fill="url(#under)"/>
    </g>
    <text x="194" y="89" fill="#4aa3ff">WPF Button</text>
    <text x="194" y="124" fill="#ffd166">NSButton</text>
    <text x="194" y="159" fill="#4cd964">Gtk.Button</text>
    <text x="157" y="196" fill="#8a94a6" text-anchor="middle">.ToNative()</text>
  </g>
</svg>
