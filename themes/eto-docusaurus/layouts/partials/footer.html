<footer class="site-footer">
  <div class="site-footer__inner">
    {{ range site.Params.footerColumns }}
      <div>
        <h4>{{ .title }}</h4>
        <ul>
          {{ range .links }}
            <li><a href="{{ .url }}">{{ .label }}</a></li>
          {{ end }}
        </ul>
      </div>
    {{ end }}
  </div>
  <div class="site-footer__meta">
    <p>© {{ now.Year }} Picoe Software. Built with Hugo + the eto-docusaurus theme.</p>
  </div>
</footer>
