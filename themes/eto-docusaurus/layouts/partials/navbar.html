<header class="navbar" role="banner">
  <div class="navbar__inner">
    <a class="navbar__brand" href="{{ relLangURL "/" }}" aria-label="{{ site.Title }} home">
      <img src="{{ (site.Params.logo | default "img/logo.svg") | relURL }}" alt="" role="presentation" />
      <div>
        <div class="navbar__title">{{ site.Title }}</div>
        <div class="navbar__tagline">{{ site.Params.tagline }}</div>
      </div>
    </a>
    <nav class="navbar__items" aria-label="Primary navigation">
      {{- $current := . -}}
      {{- range site.Menus.main }}
        {{- $isExternal := hasPrefix .URL "http" -}}
        {{- $isActive := or (.IsMenuCurrent "main" $current) (.HasMenuCurrent "main" $current) -}}
        <a href="{{ if $isExternal }}{{ .URL }}{{ else }}{{ relLangURL .URL }}{{ end }}" class="navbar__link {{ if $isActive }}active{{ end }}" {{ if $isExternal }}target="_blank" rel="noreferrer noopener"{{ end }}>{{ .Name }}</a>
      {{- end }}
    </nav>
    <div class="navbar__actions">
      <form class="navbar__search" role="search" aria-label="Site search" action="/search" method="get">
        <input type="search" name="q" placeholder="Search docs" aria-label="Search docs" />
      </form>
      <button class="theme-toggle" type="button" data-toggle-theme aria-label="Toggle dark mode">
        <span class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true">☀️</span>
        <span class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true">🌙</span>
      </button>
      {{ with site.Params.githubURL }}
        <a class="navbar__github" href="{{ . }}" target="_blank" rel="noreferrer noopener" aria-label="GitHub">
          <svg viewBox="0 0 24 24" role="img" aria-hidden="true"><path d="M12 .5C5.65.5.5 5.65.5 12.02c0 5.1 3.35 9.42 8 10.95.59.12.8-.25.8-.57 0-.27-.01-.99-.02-1.94-3.26.71-3.95-1.56-3.95-1.56-.53-1.36-1.31-1.71-1.31-1.71-1.06-.72.08-.7.08-.7 1.18.08 1.8 1.2 1.8 1.2 1.05 1.79 2.74 1.27 3.41.97.11-.77.41-1.27.75-1.59-2.61-.3-5.36-1.31-5.36-5.8 0-1.28.46-2.33 1.21-3.15-.12-.3-.52-1.49.11-3.1 0 0 .98-.32 3.22 1.2.93-.26 1.93-.39 2.93-.4 1 .01 2 .14 2.93.4 2.24-1.52 3.22-1.2 3.22-1.2.63 1.61.24 2.8.12 3.1.76.82 1.21 1.87 1.21 3.15 0 4.5-2.75 5.49-5.37 5.79.42.36.81 1.08.81 2.18 0 1.57-.01 2.83-.01 3.22 0 .32.21.69.81.57 4.65-1.53 8-5.85 8-10.95C23.5 5.65 18.35.5 12 .5z" /></svg>
        </a>
      {{ end }}
    </div>
  </div>
</header>
