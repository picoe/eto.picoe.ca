<!DOCTYPE html>
<html lang="{{ site.Language.Lang }}">
  <head>
    {{ partial "head.html" . }}
    {{ block "head" . }}{{ end }}
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    {{ partial "site-header.html" (dict "page" . "active" "") }}
    {{ block "hero" . }}{{ end }}
    <div class="site-body">
      {{ partial "sidebar.html" . }}
      <main id="main" class="site-content">
        {{ block "main" . }}{{ end }}
      </main>
    </div>
    {{ partial "footer.html" . }}
  </body>
</html>
