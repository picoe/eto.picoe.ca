{{- /* Light / system / dark switch. theme-script.html applies the choice; this only shows it. */ -}}
<div class="theme-toggle" id="eto-theme-toggle" role="radiogroup" aria-label="Theme">
  <button type="button" role="radio" data-theme-choice="light" title="Light" aria-label="Light">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"/></svg>
  </button>
  <button type="button" role="radio" data-theme-choice="system" title="System" aria-label="System">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4" width="19" height="12.5" rx="1.5"/><path d="M8.5 20.5h7M12 16.5v4"/></svg>
  </button>
  <button type="button" role="radio" data-theme-choice="dark" title="Dark" aria-label="Dark">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></svg>
  </button>
</div>
<script>
(function () {
  var root = document.documentElement;
  var toggle = document.getElementById('eto-theme-toggle');
  function show() {
    var pref = root.getAttribute('data-theme-pref') || 'system';
    toggle.querySelectorAll('[data-theme-choice]').forEach(function (b) {
      b.setAttribute('aria-checked', b.getAttribute('data-theme-choice') === pref ? 'true' : 'false');
    });
  }
  toggle.addEventListener('click', function (e) {
    var b = e.target.closest('[data-theme-choice]');
    if (!b) return;
    window.etoTheme.set(b.getAttribute('data-theme-choice'));
    show();
  });
  show();
})();
</script>
