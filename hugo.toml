baseURL = "https://eto.picoe.ca/"
languageCode = "en"
title = "Eto.Forms"
enableRobotsTXT = true
defaultContentLanguage = "en"

author = "Picoe Software"

theme = 'ananke'

disableKinds = ["taxonomy", "term"]


[params]
tagline = "Native Cross Platform UI made easy."
heroCTALabel = "Get Started"
heroCTAURL = "/docs/quickstart/"
heroDescription = "Eto.Forms lets you build native desktop applications with a single, shared .NET codebase."
githubURL = "https://github.com/picoe/Eto"
siteDescription = "Documentation and API reference for Eto.Forms, the native cross platform UI toolkit."
installCommand = """dotnet new install Eto.Forms.Templates
dotnet new etoapp -o MyApp
cd MyApp
dotnet run"""

  # Shown beside the code sample on the home page, all running that sample.
  # width is in CSS pixels, chosen so each window shows at about the same size.
  [[params.screenshots]]
  platform = "Windows"
  image = "/img/screenshot-windows.png"
  width = 365

  [[params.screenshots]]
  platform = "macOS"
  image = "/img/screenshot-macos.png"
  width = 405

  # Home page scrolling features: the image pins beside the text as each one scrolls by.
  [[params.featureCards]]
  eyebrow = "One codebase"
  title = "Write your UI once. In the language you love."
  icon = "/img/feature-write-ui.svg"
  body = "Describe your interface in C#, F# or VB.NET, or keep it declarative with XAML or JSON. However you write it, the same UI ships to Windows, macOS and Linux without a single `#if`."
  points = [
    "Layouts like `StackLayout` and `TableLayout` size themselves, so there's no pixel pushing.",
    "Data binding keeps your views and models in sync with a line of code.",
    "Mix code and markup freely, even in the same window.",
  ]
  linkLabel = "Try the tutorials"
  linkURL = "/docs/tutorials/"

  [[params.featureCards]]
  eyebrow = "Truly native"
  title = "Not a lookalike. The real thing."
  icon = "/img/feature-native-controls.svg"
  body = "Eto.Forms doesn't draw its own imitation widgets. Every button, list and dialog is the platform's own: WPF or WinForms on Windows, Cocoa on macOS and GTK on Linux. Your app looks, feels and behaves like it belongs, because it does."
  points = [
    "Accessibility, keyboard navigation and text input come straight from the OS.",
    "Native rendering means fast startup and a small footprint.",
    "Release builds bundle .NET, so users just download and run.",
  ]
  linkLabel = "See supported platforms"
  linkURL = "/docs/quickstart/supported-platforms/"

  [[params.featureCards]]
  eyebrow = "No dead ends"
  title = "Drop to native whenever you need to."
  icon = "/img/feature-native-access.svg"
  body = "Cross-platform shouldn't mean lowest common denominator. Reach the underlying native control from any Eto control, add platform-specific styles, or build custom controls with a native implementation for each platform."
  points = [
    "Embed Eto in an existing WinForms, WPF or Cocoa app, one window at a time.",
    "Host native controls inside your Eto layouts.",
    "Style controls per platform without touching your shared code.",
  ]
  linkLabel = "Read about embedding"
  linkURL = "/docs/guides/embedding/"

  [[params.featureCards]]
  eyebrow = "Developer extensions"
  title = "See it before you run it."
  icon = "/img/feature-dev-extensions.svg"
  body = "The developer extensions for Visual Studio, VS Code and Rider put a live preview right beside your editor. It redraws as you type, on the platform and theme you choose, so you can design without the build and run loop."
  points = [
    "IntelliSense for controls, properties, events and bindings in XAML and JSON.",
    "Jump between designer and code with a single key.",
    "Project and item templates to get going in seconds.",
  ]
  linkLabel = "Get the extensions"
  linkURL = "/docs/devextensions/"

[[params.footerColumns]]
  title = "Docs"
  [[params.footerColumns.links]]
    label = "Quick Start"
    url = "/docs/quickstart/"
  [[params.footerColumns.links]]
    label = "Tutorials"
    url = "/docs/tutorials/"

[[params.footerColumns]]
  title = "Community"
  [[params.footerColumns.links]]
    label = "GitHub Discussions"
    url = "https://github.com/picoe/Eto/discussions"
  [[params.footerColumns.links]]
    label = "Stack Overflow"
    url = "https://stackoverflow.com/questions/tagged/eto"

[[params.footerColumns]]
  title = "More"
  [[params.footerColumns.links]]
    label = "GitHub"
    url = "https://github.com/picoe/Eto"

[menu]
  [[menu.main]]
    identifier = "docs"
    name = "Docs"
    url = "/docs/"
    weight = 1
  [[menu.main]]
    identifier = "api"
    name = "API"
    url = "/api/"
    weight = 2
  [[menu.main]]
    identifier = "github"
    name = "GitHub"
    url = "https://github.com/picoe/Eto"
    weight = 3

[minify.tdewolff.html]
  # Keeps the <!-- owl:... --> marks in the API header snippet that Owl fills in.
  keepComments = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    style = "github"
    lineNos = false
