baseURL = "https://eto.picoe.ca/"
languageCode = "en"
title = "Eto.Forms"
enableRobotsTXT = true
defaultContentLanguage = "en"

author = "Picoe Software"

theme = 'ananke'

disableKinds = ["taxonomy", "term"]


[params]
tagline = "Native Cross Platform UI made easy."
heroCTALabel = "Get Started"
heroCTAURL = "/docs/quickstart/"
heroDescription = "Eto.Forms lets you build native desktop applications with a single, shared .NET codebase."
githubURL = "https://github.com/picoe/Eto"
siteDescription = "Documentation and API reference for Eto.Forms, the native cross platform UI toolkit."
installCommand = """dotnet new install Eto.Forms.Templates
dotnet new etoapp -o MyApp
cd MyApp
dotnet run"""

  # Shown beside the code sample on the home page, all running that sample.
  [[params.screenshots]]
  platform = "macOS"
  image = "/img/screenshot-macos.png"

  [[params.featureCards]]
  title = "Write UI Your Way"
  icon = "/img/feature-write-ui.svg"
  body = "Build your UI in C#, VB.NET or F#, or in XAML or JSON. Layouts like `StackLayout` and `TableLayout` size themselves, so there's no pixel pushing."

  [[params.featureCards]]
  title = "Native on Every Platform"
  icon = "/img/feature-native-controls.svg"
  body = "Each control is the platform's own: WPF or WinForms on Windows, Cocoa on macOS and GTK on Linux. Your app looks and behaves like it belongs."

  [[params.featureCards]]
  title = "Drop to Native When You Need To"
  icon = "/img/feature-native-access.svg"
  body = "Reach the underlying native control from any Eto control, embed Eto in an existing app, or write your own custom controls."

[[params.footerColumns]]
  title = "Docs"
  [[params.footerColumns.links]]
    label = "Quick Start"
    url = "/docs/quickstart/"
  [[params.footerColumns.links]]
    label = "Tutorials"
    url = "/docs/tutorials/"

[[params.footerColumns]]
  title = "Community"
  [[params.footerColumns.links]]
    label = "GitHub Discussions"
    url = "https://github.com/picoe/Eto/discussions"
  [[params.footerColumns.links]]
    label = "Stack Overflow"
    url = "https://stackoverflow.com/questions/tagged/eto"

[[params.footerColumns]]
  title = "More"
  [[params.footerColumns.links]]
    label = "GitHub"
    url = "https://github.com/picoe/Eto"

[menu]
  [[menu.main]]
    identifier = "docs"
    name = "Docs"
    url = "/docs/"
    weight = 1
  [[menu.main]]
    identifier = "api"
    name = "API"
    url = "/api/"
    weight = 2
  [[menu.main]]
    identifier = "github"
    name = "GitHub"
    url = "https://github.com/picoe/Eto"
    weight = 3

[minify.tdewolff.html]
  # Keeps the <!-- owl:... --> marks in the API header snippet that Owl fills in.
  keepComments = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    style = "github"
    lineNos = false
